// RUT chileno: se usa como llave para encontrar el deal despues, asi que se valida el
// digito verificador al tipear. Un RUT mal escrito rompe la busqueda mas adelante.
const limpiarRut = (v) => String(v||"").replace(/[^0-9kK]/g, "").toUpperCase();
const dvRut = (cuerpo) => { let s=0,m=2; for(let i=cuerpo.length-1;i>=0;i--){s+=parseInt(cuerpo[i])*m;m=m===7?2:m+1;} const r=11-(s%11); return r===11?"0":r===10?"K":String(r); };
const formatearRut = (v) => { const c=limpiarRut(v); if(c.length<2) return c; return c.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+c.slice(-1); };
const rutValido = (v) => { const c=limpiarRut(v); if(c.length<8) return false; const b=c.slice(0,-1); return /^\d+$/.test(b) && dvRut(b)===c.slice(-1); };
const parsePesos = (v) => { const s = String(v||"").replace(/\./g,"").replace(/,/g,""); return parseInt(s) || 0; };

// ═══════════════════════════════════════════════════════════════════════════
function DealFinal() {
  // Catalog state
  const [catalogo, setCatalogo] = useState(CATALOGO_LOCAL);

  const [mIdx, setMIdx] = useState(null);

  const [descPesos, setDescPesos] = useState("");
  const [bonoZonal, setBonoZonal] = useState("");
  const [comisionCredito, setComisionCredito] = useState("");
  const [showUtil, setShowUtil] = useState(false);
  const [vendedor, setVendedor] = useState(lsGet("vendedor") || "");

  const [postCierreMsg, setPostCierreMsg] = useState(null);

  const [showDetalle, setShowDetalle] = useState(false);

  const [pushDispoOk, setPushDispoOk] = useState(false);

  // Documentation items
  // El Grabado se cotiza como accesorio, no como documento: viene cargado por defecto en
// todos los deals y no se puede quitar.
const ACC_FIJOS = [{id:900,nombre:"Grabado",monto:35000,fijo:true}];
const defaultDocs = [
    {id:1,nombre:"SOAP",monto:18400,activo:true},
    {id:2,nombre:"Inscripción",monto:89560,activo:true},
    {id:3,nombre:"Trámite",monto:50000,activo:true},
    {id:4,nombre:"TAG",monto:15000,activo:true},
    {id:6,nombre:"Permiso Circulación",monto:0,activo:true},
    {id:7,nombre:"Impuesto Verde",monto:0,activo:true},
  ];
  const [docItems, setDocItems] = useState(defaultDocs);
  const [accItems, setAccItems] = useState(ACC_FIJOS.map(a=>({...a})));
  const [newAccNombre, setNewAccNombre] = useState("");
  const [newAccMonto, setNewAccMonto] = useState("");

  // Deal registry
  const [deals, setDeals] = useState(lsGetDeals());
  const [importCode, setImportCode] = useState("");
  const [copyMsg, setCopyMsg] = useState("");

  // ─── Try load catalog from Sheets on mount ───
  useEffect(() => {
    if (!SCRIPT_URL) return;
    setCatLoading(true);
    fetch(SCRIPT_URL + "?action=catalogo")
      .then(r => r.json())
      .then(data => {
        if (data && data.Peugeot) {
          setCatalogo(data);
          setCatSource("sheets");
        }
      })
      .catch(() => {})
      .finally(() => setCatLoading(false));
  }, []);

  // ─── Derived data ───
  const modelos = useMemo(() => {
    if (!marca || !tipo) return [];
    return catalogo[marca]?.[tipo] || [];
  }, [marca, tipo, catalogo]);

  const familias = useMemo(() => {
    const map = {};
    modelos.forEach((m, i) => {
      if (!map[m.familia]) map[m.familia] = [];
      map[m.familia].push({...m, idx:i});
    });
    return map;
  }, [modelos]);

  const auto = mIdx !== null ? modelos[mIdx] : null;
  const pushList = (auto && PUSH_VIGENTE) ? (PUSH_VIN.data[auto.modelo] || null) : null;
  const pushSel = (pushVin && pushList) ? (pushList.find(x=>x.v===pushVin) || null) : null;
  const proxMes = (auto && PROX_MES.data[auto.modelo] && PROX_MES.data[auto.modelo].delta > 0) ? PROX_MES.data[auto.modelo] : null;
  const formasPago = useMemo(() => {
    if (!auto) return ["tmp","cc"];
    const fps = ["tmp","cc"];
    if (auto.ci) fps.push("ci");
    return fps;
  }, [auto]);
  const pe = formasPago.includes(pago) ? pago : "tmp";

  // ─── Calculations ───
  const calc = useMemo(() => {
    if (!auto) return null;
    const fp = auto[pe];
    if (!fp) return null;
    const esCom = tipo === "Comerciales";
    const maxDescPesos = Math.round(auto.pl * auto.margen);
    const descNum = Math.min(parsePesos(descPesos), maxDescPesos);
    const descPompeyoPct = auto.pl > 0 ? descNum / auto.pl : 0;
    const bonoZonalNum = parsePesos(bonoZonal);
    const aporteRedPesos = fp.aporteRed || 0;
    // Cada aporte se muestra SIEMPRE con IVA incluido (comerciales: los aportes vienen netos del
    // catalogo, se multiplican x1.19; pasajeros: ya vienen con IVA, no se tocan). Aporte
    // Stellantis absorbe el resto para que la suma cuadre siempre exacto con fp.bono (evita
    // descuadres de $1 por redondeo independiente en cada linea).
    const aporteRedConIva = esCom ? Math.round(aporteRedPesos * 1.19) : aporteRedPesos;
    // El % de CE se calcula contra el precio lista, que SIEMPRE viene con IVA. Por eso hay que
    // usar el aporte con IVA: en comerciales el aporte del catalogo es neto y dividirlo directo
    // por el precio lista subestimaba el CE en ~0.40 puntos (2.10% en vez del tope real 2.5%),
    // lo que ademas impedia que saltara la alerta amarilla del 4% de total dado.
    const cePct = auto.pl > 0 ? aporteRedConIva / auto.pl : 0;
    const totalDadoPct = descPompeyoPct + cePct;
    const aporteFinConIva = esCom ? Math.round((fp.aporteFin||0) * 1.19) : (fp.aporteFin||0);
    const aporteSteConIva = esCom ? (fp.bono - aporteRedConIva - aporteFinConIva) : (fp.aporteSte||0);
    const precioAuto = auto.pl - fp.bono - descNum - bonoZonalNum;
    const precioNeto = Math.round(precioAuto / 1.19);
    const totalDoc = docItems.filter(d=>d.activo).reduce((s,d)=>s+parsePesos(d.monto), 0);
    const totalAcc = accItems.reduce((s,a)=>s+parsePesos(a.monto), 0);
    const totalCliente = precioAuto + totalDoc + totalAcc;
    const margenBruto = maxDescPesos;
    const margenDisponible = margenBruto - aporteRedConIva;
    const margenNetoAuto = margenDisponible - descNum;
    const margenNeto = margenNetoAuto - GASTOS_ROMA;
    // ─── VENTA FLOTA (B2B) ───────────────────────────────────────────────────
    // Base de calculo distinta a retail: parte del precio lista SIN IVA y le aplica el % del
    // tramo por volumen. No hay bono ni CE. Lo que le queda a la casa es el margen fijo menos
    // su propio aporte (RED). Los valores del catalogo b2b vienen todos netos.
    const esFlota = modoVenta === "flota";
    const b2b = auto.b2b || null;
    const trFlota = (esFlota && b2b && b2b[tramoFlota]) ? b2b[tramoFlota] : null;
    // El descuento de flota no es un numero suelto: es la suma del aporte de Stellantis mas
    // el aporte obligado del concesionario. Los dos salen de la lista de descuentos B2B y su
    // suma da exactamente el % del tramo (verificado en las 95 filas de la planilla).
    const redFlota = trFlota ? (CONCESIONARIO_B2B === "professional" ? trFlota.redProf : trFlota.redNoProf) : 0;
    const steFlota = trFlota ? (CONCESIONARIO_B2B === "professional" ? trFlota.steProf : trFlota.steNoProf) : 0;
    const precioFlotaNeto = trFlota ? trFlota.precio : 0;
    const precioFlotaConIva = trFlota ? Math.round(trFlota.precio * 1.19) : 0;
    const descFlotaPesos = (trFlota && b2b) ? (b2b.plSinIva - trFlota.precio) : 0;
    const aporteSteFlota = (trFlota && b2b) ? Math.round(b2b.plSinIva * steFlota) : 0;
    // El aporte de la casa se calcula por diferencia para que los dos sumen exacto el
    // descuento y no queden pesos sueltos por redondeo.
    const aporteRedFlota = trFlota ? (descFlotaPesos - aporteSteFlota) : 0;
    const margenFlotaPct = (trFlota && b2b) ? (b2b.margenFijo - redFlota) : 0;
    const margenFlotaPesos = (trFlota && b2b) ? Math.round(b2b.plSinIva * margenFlotaPct) : 0;

    const precioAutoFinal = (esFlota && trFlota) ? precioFlotaConIva : precioAuto;
    const totalClienteFinal = precioAutoFinal + totalDoc + totalAcc;

    const comCredNum = parsePesos(comisionCredito);
    const utilidadProxy = margenNeto + comCredNum;
    const utilidadPct = auto.pl > 0 ? utilidadProxy / auto.pl : 0;

    // En flota la utilidad se arma con otra base: lo que queda del margen fijo despues del
    // aporte del concesionario. Los gastos de Roma se descuentan igual que en retail.
    // El % va contra el precio lista SIN IVA, que es la base con la que se calculo el margen:
    // compararlo contra el precio con IVA daria un porcentaje mas chico y enganoso.
    const margenFlotaNeto = trFlota ? (margenFlotaPesos - GASTOS_ROMA) : 0;
    const utilidadFlota = margenFlotaNeto + comCredNum;
    const utilidadFlotaPct = (trFlota && b2b && b2b.plSinIva > 0) ? utilidadFlota / b2b.plSinIva : 0;

    const utilFinal = esFlota ? utilidadFlota : utilidadProxy;
    const utilPctFinal = esFlota ? utilidadFlotaPct : utilidadPct;
    let alertaDesc = null;
    if (descNum > maxDescPesos) alertaDesc = "roja";
    else if (totalDadoPct > 0.04) alertaDesc = "amarilla";
    let utilColor = C.green, utilIcon = "🟢";
    if (utilPctFinal < 0.03) { utilColor = C.red; utilIcon = "🔴"; }
    else if (utilPctFinal < 0.05) { utilColor = C.yellow; utilIcon = "🟡"; }
    return { fp, esCom, descNum, descPompeyoPct, totalDadoPct, cePct, maxDescPesos, bonoZonalNum,
      aporteRedConIva, aporteSteConIva, aporteFinConIva, precioAuto, precioNeto, totalDoc, totalAcc, totalCliente,
      margenBruto, aporteRedPesos, margenDisponible, margenNetoAuto, margenNeto,
      comCredNum, utilidadProxy, utilidadPct, alertaDesc, utilColor, utilIcon,
      esFlota, b2b, trFlota, redFlota, steFlota, aporteSteFlota, aporteRedFlota,
      precioFlotaNeto, precioFlotaConIva,
      descFlotaPesos, margenFlotaPct, margenFlotaPesos,
      margenFlotaNeto, utilidadFlota, utilidadFlotaPct, utilFinal, utilPctFinal,
      // Lo que efectivamente paga el cliente. En flota es el precio del tramo llevado a IVA;
      // en retail es el de siempre. Nunca se suman los dos.
      precioAutoFinal, totalClienteFinal };
  }, [auto, pe, descPesos, bonoZonal, docItems, accItems, comisionCredito, tipo, modoVenta, tramoFlota]);

  // ─── Actions ───
  const mc = marca === "Peugeot" ? C.peugeot : marca === "Citroën" ? C.citroen : C.accent;

  const resetCalc = useCallback(() => {

    setShowUtil(false);setAccItems(ACC_FIJOS.map(a=>({...a})));setCliente("");setRutCliente("");setModoVenta("retail");setTramoFlota("t1");setConfirmCierre(false);
    setDocItems(defaultDocs.map(d=>({...d})));
    setEditingDealId(null);setPushVin("");setPushDispoOk(false);

  const goHome = () => { resetCalc(); setView("home"); };

  const seleccionarPushVin = (vin) => {

    const item = lista.find(x=>x.v===vin);

  const toggleDoc = (id) => setDocItems(d=>d.map(x=>x.id===id?{...x,activo:!x.activo}:x));
  const updateDocMonto = (id,v) => setDocItems(d=>d.map(x=>x.id===id?{...x,monto:v}:x));
  const addAcc = () => {

    setAccItems(a=>[...a,{id:uid(),nombre:newAccNombre.trim(),monto:parsePesos(newAccMonto)}]);

  // ─── Compartir: usa el share nativo del celular; si no está disponible, copia al portapapeles ───
  const copiarAlPortapapeles = (msg) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg)
        .then(()=>alert("Resumen copiado al portapapeles. Pegalo donde quieras enviarlo (WhatsApp, Mail, etc.)."))
        .catch(()=>alert("No se pudo copiar automáticamente. Copiá el texto manualmente desde el registro."));

      alert("No se pudo copiar automáticamente. Copiá el texto manualmente desde el registro.");

  };

  const compartirDeal = async (msg) => {
    if (navigator.share) {
      try {
        await navigator.share({ title: "Deal Final · Pompeyo", text: msg });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // el vendedor canceló el share, no hacer nada más
        copiarAlPortapapeles(msg);
        return;
      }
    }
    copiarAlPortapapeles(msg);
  };

  // ─── Arma el mensaje de validación (texto plano, sin emoji, con el mismo desglose que Utilidad Proxy) ───
  const buildMensajeDeal = (deal, code) => {
    const L = [];
    L.push("DEAL FINAL - PARA VALIDACIÓN");
    L.push(`Fecha: ${deal.fecha}${deal.editado ? " (editado)" : ""}`);
    L.push(`Vendedor: ${deal.vendedor}`);
    L.push(`Cliente: ${deal.cliente}`);
    if (deal.rutCliente) L.push(`RUT: ${deal.rutCliente}`);
    L.push("");
    L.push(`Modelo: ${deal.modelo}`);
    L.push(`CIT: ${deal.cit}`);
    // Un deal de flota se lee distinto: no tiene bono ni descuento Pompeyo, y el precio
    // de referencia es neto. El resumen que se comparte tiene que decirlo desde arriba.
    const esFlotaDeal = deal.modoVenta === "flota";
    if (esFlotaDeal) {
      const TR = {t1:"Tramo 1 (1 a 5 un.)", t2:"Tramo 2 (6 a 99 un.)", gc:"Grandes Cuentas (+100 un.)"};
      L.push(`VENTA FLOTA (B2B) · ${TR[deal.tramoFlota] || deal.tramoFlota}`);
      L.push("");
      L.push("--- PRECIO FLOTA (la lista B2B va SIN IVA) ---");
      if (deal.aporteSteFlota) {
        L.push(`Aporte Stellantis: ${fmt(deal.aporteSteFlota)}`);
        L.push(`Aporte concesionario: ${fmt(deal.aporteRedFlota)}`);
        L.push(`Descuento total: ${fmt(deal.descFlotaPesos)}`);
      }
      L.push(`Precio flota NETO: ${fmt(deal.precioFlotaNeto)}`);
      L.push(`Equivalente con IVA: ${fmt(deal.precioFlotaConIva)}`);
      L.push("");
      L.push("--- UTILIDAD (interno, no mostrar al cliente) ---");
      L.push(`Margen neto flota: ${fmt(deal.margenNeto)}`);
      if (deal.comisionCredito > 0) L.push(`Comisión crédito: ${fmt(deal.comisionCredito)}`);
      L.push(`Utilidad Proxy: ${fmt(deal.utilidadProxy)} (${pct(deal.utilidadPct)})`);
      L.push("");
      L.push(`Documentación: ${fmt(deal.totalDoc)}`);
      if (deal.totalAcc > 0) L.push(`Accesorios: ${fmt(deal.totalAcc)}`);
      L.push(`TOTAL CLIENTE (con IVA): ${fmt(deal.totalCliente)}`);
      L.push("");
      L.push(`Código: ${code}`);
      return L.join("\n");
    }
    L.push(`Forma de pago: ${deal.formaPago}`);
    L.push("");
    L.push("--- BONO ---" + (deal.esCom ? " (con IVA)" : ""));
    if (deal.pushVin) {
      L.push(`PUSH VIN: ${deal.pushVin}`);
      L.push(`  Aporte Marca (en Bono Zonal): ${fmt(deal.pushMarca)}`);
      L.push(`  Aporte Ces (en Desc. Pompeyo): ${fmt(deal.pushCes)}`);
    }
    L.push(`Aporte Red (CE 2,5%): ${fmt(deal.aporteRed)}`);
    L.push(`Aporte Stellantis: ${fmt(deal.aporteSte)}`);
    if (deal.aporteFin > 0) L.push(`Aporte Financiera: ${fmt(deal.aporteFin)}`);
    L.push(`Bono Total: ${fmt(deal.bonoTotal)}`);
    L.push("");
    L.push("--- DESCUENTO ---");
    L.push(`Descuento Pompeyo: ${fmt(deal.descPompeyo)} (${pct(deal.descPompeyoPct)})`);
    L.push(`Aporte Red CE: ${fmt(deal.aporteRed)} (${pct(deal.cePct)})`);
    L.push(`Total dado (Pompeyo + CE): ${pct(deal.totalDadoPct)}`);
    if (deal.bonoZonal > 0) L.push(`Bono Zonal: ${fmt(deal.bonoZonal)}`);
    L.push("");
    L.push(`Precio Auto: ${fmt(deal.precioAuto)}`);
    L.push(`Documentación: ${fmt(deal.totalDoc)}`);
    if (deal.totalAcc > 0) L.push(`Accesorios: ${fmt(deal.totalAcc)}`);
    L.push(`TOTAL CLIENTE: ${fmt(deal.totalCliente)}`);
    L.push("");
    L.push("--- UTILIDAD (interno, no mostrar al cliente) ---");
    L.push(`Margen neto auto: ${fmt(deal.margenNeto)}`);
    L.push(`Comisión crédito: ${fmt(deal.comisionCredito)}`);
    L.push(`Utilidad Proxy: ${fmt(deal.utilidadProxy)} (${pct(deal.utilidadPct)})`);
    L.push("");
    L.push(`Código: ${code}`);
    return L.join("\n");
  };

  // ─── Cerrar (o actualizar) Deal ───
  // Para cerrar hacen falta: vendedor, nombre, RUT valido y — si es credito — la comision.
  // En flota no hay forma de pago, asi que la comision de credito no se exige.
  const comisionOk = modoVenta === "flota" || !(pe === "cc" || pe === "ci") || !!comisionCredito;
  const puedeCerrar = !!cliente.trim() && !!vendedor.trim() && rutValido(rutCliente) && comisionOk;

  const cerrarDeal = () => {
    if (!auto || !calc) return;
    if (!puedeCerrar) return;
    const prevDeal = editingDealId ? (deals.find(d=>d.id===editingDealId) || {}) : {};
    const deal = {
      ...prevDeal,
      id: editingDealId || Date.now(),
      fecha: prevDeal.fecha || new Date().toLocaleDateString("es-CL"),
      editado: !!editingDealId,
      fechaEdicion: editingDealId ? new Date().toLocaleDateString("es-CL") : (prevDeal.fechaEdicion || null),
      vendedor, cliente, rutCliente, marca, tipo, modelo: auto.modelo, cit: auto.cit,
      modoVenta, tramoFlota: calc.esFlota ? tramoFlota : null,
      precioFlotaNeto: calc.esFlota ? calc.precioFlotaNeto : 0,
      aporteSteFlota: calc.esFlota ? calc.aporteSteFlota : 0,
      aporteRedFlota: calc.esFlota ? calc.aporteRedFlota : 0,
      descFlotaPesos: calc.esFlota ? calc.descFlotaPesos : 0,
      precioFlotaConIva: calc.esFlota ? calc.precioFlotaConIva : 0,
      formaPago: PL[pe], pagoKey: pe, precioLista: auto.pl, bonoTotal: calc.fp.bono,
      descPompeyo: calc.descNum, descPompeyoPct: calc.descPompeyoPct, cePct: calc.cePct,
      totalDadoPct: calc.totalDadoPct, bonoZonal: calc.bonoZonalNum,
      precioAuto: calc.precioAutoFinal, totalDoc: calc.totalDoc,
      totalAcc: calc.totalAcc, totalCliente: calc.totalClienteFinal,
      precioAutoRetail: calc.precioAuto,
      utilidadProxy: calc.utilFinal, utilidadPct: calc.utilPctFinal,
      margenNeto: calc.esFlota ? calc.margenFlotaNeto : calc.margenNeto,
      comisionCredito: calc.comCredNum,
      esCom: calc.esCom, aporteRed: calc.aporteRedConIva, aporteSte: calc.aporteSteConIva,
      aporteFin: calc.aporteFinConIva || 0,
      pushVin: pushSel ? pushSel.v : null, pushMarca: pushSel ? pushSel.mk : 0, pushCes: pushSel ? pushSel.ce : 0, pushTotal: pushSel ? pushSel.m : 0,
      // snapshot editable para poder reabrir el deal más tarde
      docItems: docItems.map(d=>({...d})), accItems: accItems.map(a=>({...a})),
    };
    if (editingDealId) { lsUpdateDeal(deal); } else { lsSaveDeal(deal); }
    setDeals(lsGetDeals());

    // Post to Sheets if connected
    if (SCRIPT_URL) {
      fetch(SCRIPT_URL, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action: editingDealId ? "deal_update" : "deal", deal}) }).catch(()=>{});
    }

    const code = encodeDeal(deal);
    const msg = buildMensajeDeal(deal, code);
    setPostCierreCode(code);
    setPostCierreMsg(msg);
    setShowDetalle(false);
    goHome();
  };

  // ─── Import deal from code ───
  const importDeal = () => {
    const d = decodeDeal(importCode);
    if (!d) { alert("Código inválido"); return; }
    if (!lsGetDeals().find(x=>x.id===d.id)) { lsSaveDeal(d); setDeals(lsGetDeals()); }
    setImportCode("");
    cargarDealParaEditar(d);
  };

  const deleteDeal = (id) => { lsDeleteDeal(id); setDeals(lsGetDeals()); };

  const copyRegistro = () => {
    // Se agregan RUT, modo y tramo para poder cruzar el registro con otras planillas.
    const header = "Fecha\tVendedor\tCliente\tRUT\tModelo\tModo\tTramo\tPago\tPrecio Lista\tBono\tDesc\tZonal\tPrecio Auto\tDoc\tAcc\tTotal Cliente";
    const rows = deals.map(d=>`${d.fecha}\t${d.vendedor}\t${d.cliente}\t${d.rutCliente||""}\t${d.modelo}\t${d.modoVenta==="flota"?"Flota":"Retail"}\t${d.tramoFlota?String(d.tramoFlota).toUpperCase():""}\t${d.modoVenta==="flota"?"":d.formaPago}\t${d.precioLista}\t${d.bonoTotal}\t${d.descPompeyo}\t${d.bonoZonal}\t${d.precioAuto}\t${d.totalDoc}\t${d.totalAcc}\t${d.totalCliente}`);
    navigator.clipboard.writeText(header+"\n"+rows.join("\n"))
      .then(()=>{ setCopyMsg("✅ Copiado"); setTimeout(()=>setCopyMsg(""),2000); })
      .catch(()=>{ setCopyMsg("❌ Error"); setTimeout(()=>setCopyMsg(""),2000); });
  };

  const chip = (label,value,color) => (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0"}}>
      <span style={{fontSize:12,color:color||C.muted}}>{label}</span>
      <span style={{fontSize:12,fontWeight:600,color:color||C.text}}>{fmt(value)}</span>
    </div>
  );

  const modelCount = Object.values(catalogo).reduce((s,brand)=>s+Object.values(brand).reduce((s2,arr)=>s2+arr.length,0),0);

  // ═══════════════════════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════════════════════
  return (
    <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",background:C.bg,minHeight:"100vh",maxWidth:460,margin:"0 auto",paddingBottom:120,color:C.text,fontSize:14,lineHeight:1.5}}>

      {/* ═══ HEADER ═══ */}
      <div style={{background:view==="calc"&&marca?mc:C.primary,color:"#fff",padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div>
          <div style={{fontSize:17,fontWeight:700,letterSpacing:"-0.02em"}}>Deal Final</div>
          <div style={{fontSize:11,opacity:0.6}}>
            {view==="calc" && auto ? auto.modelo : view==="calc" && marca ? `${marca} · ${tipo||""}` : `Catálogo ${catSource} · ${modelCount} modelos`}
          </div>
          {/* La version y la fecha de actualizacion se muestran SIEMPRE, en todas las vistas.
              Antes solo aparecian en el inicio y se perdian al entrar a un modelo, que es
              justo cuando el vendedor necesita poder confirmar que no quedo con la version
              vieja en cache del celular. */}
          <div style={{fontSize:10,opacity:0.45,letterSpacing:"0.02em"}}>{APP_VERSION}</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          {view !== "home" && <div onClick={goHome} style={{cursor:"pointer",fontSize:12,opacity:0.8,padding:"5px 10px",border:"1px solid rgba(255,255,255,.3)",borderRadius:6}}>Inicio</div>}
          {view === "calc" && marca && <div onClick={()=>{resetCalc();}} style={{cursor:"pointer",fontSize:12,opacity:0.8,padding:"5px 10px",border:"1px solid rgba(255,255,255,.3)",borderRadius:6}}>Nuevo</div>}
        </div>
      </div>

      {/* ═══ HOME VIEW ═══ */}
      {view === "home" && (<>
        <div style={base.section}>
          {postCierreCode && (
            <div style={{...base.card,border:"2px solid "+C.green}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:4,color:C.green}}>✅ Deal guardado</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:8}}>Comparte solo este código. Se pega en "Cargar Código" y abre el deal completo, ya validado.</div>
              <textarea readOnly value={postCierreCode} rows={3}
                style={{...base.input,resize:"vertical",fontFamily:"monospace",fontSize:11,marginBottom:8,wordBreak:"break-all"}}
                onClick={e=>e.target.select()} />
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <div onClick={()=>compartirDeal(postCierreCode)}
                  style={{flex:1,padding:"10px",borderRadius:8,background:C.accent,color:"#fff",textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:13}}>
                  Compartir código
                </div>
                <div onClick={()=>copiarAlPortapapeles(postCierreCode)}
                  style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid "+C.accent,color:C.accent,textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:13}}>
                  Copiar código
                </div>
              </div>
              <div onClick={()=>setShowDetalle(v=>!v)} style={{fontSize:12,color:C.accent,textAlign:"center",cursor:"pointer",fontWeight:600}}>
                {showDetalle ? "Ocultar detalle" : "Ver detalle (para Roma / APC)"}
              </div>
              {showDetalle && (<>
                <textarea readOnly value={postCierreMsg} rows={6}
                  style={{...base.input,resize:"vertical",fontFamily:"monospace",fontSize:11,margin:"8px 0"}}
                  onClick={e=>e.target.select()} />
                <div onClick={()=>copiarAlPortapapeles(postCierreMsg)}
                  style={{padding:"10px",borderRadius:8,border:"2px solid "+C.accent,color:C.accent,textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:13,marginBottom:8}}>
                  Copiar detalle
                </div>
              </>)}
              <div onClick={()=>{setPostCierreCode("");setPostCierreMsg(null);setShowDetalle(false);}} style={{fontSize:12,color:C.muted,textAlign:"center",cursor:"pointer",marginTop:8}}>
                Listo, ocultar
              </div>
            </div>
          )}
          {/* Vendedor */}
          <div style={{...base.card}}>
            <div style={{fontSize:13,color:C.muted,marginBottom:4}}>Tu nombre (vendedor)</div>
            <input type="text" value={vendedor} onChange={e=>{setVendedor(e.target.value);lsSet("vendedor",e.target.value);}}
              placeholder="Ej: Javier Madariaga" style={base.input} />
          </div>

          {/* Actions */}
          <div style={{display:"flex",gap:10,marginBottom:14}}>
            <div onClick={()=>{setPostCierreMsg(null);setPostCierreCode("");setView("calc");resetCalc();}}
              style={{flex:1,padding:"16px",borderRadius:10,background:C.accent,color:"#fff",textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:15}}>
              + Nuevo Deal
            </div>
            <div onClick={()=>setView("import")}
              style={{flex:1,padding:"16px",borderRadius:10,border:"2px solid "+C.accent,color:C.accent,textAlign:"center",cursor:"pointer",fontWeight:600,fontSize:14}}>
              📎 Cargar Código
            </div>
          </div>

          {/* Catalog status */}
          <div style={{...base.card,padding:10,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18}}>{catLoading?"⏳":catSource==="sheets"?"☁️":"💾"}</span>
            <span style={{fontSize:12,color:C.muted}}>
              {catLoading ? "Cargando catálogo..." : catSource==="sheets" ? `Catálogo cargado desde Sheets (${modelCount} modelos)` : `Catálogo embebido (${modelCount} modelos)`}
            </span>
          </div>

          {/* Deal Registry */}
          <div style={{...base.secTitle,marginTop:14}}>Registro de Deals ({deals.length})</div>
          {deals.length > 0 && (
            <div onClick={copyRegistro} style={{fontSize:12,color:C.accent,cursor:"pointer",marginBottom:10,fontWeight:600}}>
              📋 Copiar registro como tabla {copyMsg && <span style={{color:C.green}}>{copyMsg}</span>}
            </div>
          )}
          {deals.length === 0 && <div style={{...base.card,textAlign:"center",color:C.muted,fontSize:13}}>Sin deals registrados</div>}
          {deals.map(d => {
            const utilOk = d.utilidadPct >= 0.05;
            const utilWarn = d.utilidadPct >= 0.03 && d.utilidadPct < 0.05;
            const bg = utilOk ? C.greenBg : utilWarn ? C.yellowBg : C.redBg;
            const bc = utilOk ? C.green : utilWarn ? C.yellow : C.red;
            return (
              <div key={d.id} onClick={()=>cargarDealParaEditar(d)}
                style={{...base.card,borderLeft:"3px solid "+bc,background:bg+"44",cursor:"pointer"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700}}>{d.modelo}</div>
                    <div style={{fontSize:11,color:C.muted}}>{d.fecha}{d.editado?" (editado)":""} · {d.vendedor} · {d.cliente}{d.rutCliente?" · "+d.rutCliente:""}</div>
                    {/* Un deal de flota no tiene forma de pago: rotularlo "TMP" confunde. */}
                    <div style={{fontSize:12,marginTop:4}}>
                      {d.modoVenta === "flota"
                        ? <span style={{fontWeight:700,color:mc}}>🚚 Flota {String(d.tramoFlota||"").toUpperCase()}</span>
                        : d.formaPago} · Total: <b>{fmt(d.totalCliente)}</b>
                    </div>
                  </div>
                  <div onClick={(e)=>{e.stopPropagation();deleteDeal(d.id);}} style={{cursor:"pointer",fontSize:16,color:C.red,padding:"0 4px"}}>×</div>
                </div>
                <div style={{fontSize:11,color:C.accent,marginTop:6}}>Toca para revisar / editar →</div>
              </div>
            );
          })}
        </div>
      </>)}

      {/* ═══ IMPORT VIEW ═══ */}
      {view === "import" && (
        <div style={base.section}>
          <div style={base.secTitle}>Cargar Deal desde código</div>
          <div style={base.card}>
            <div style={{fontSize:13,color:C.muted,marginBottom:8}}>Pegá el código que te llegó por WhatsApp:</div>
            <textarea value={importCode} onChange={e=>setImportCode(e.target.value)}
              placeholder="Pegar código base64 aquí..." rows={4}
              style={{...base.input,resize:"vertical",fontFamily:"monospace",fontSize:12}} />
            <div onClick={importDeal}
              style={{marginTop:10,padding:"12px",borderRadius:8,background:C.accent,color:"#fff",textAlign:"center",cursor:"pointer",fontWeight:600}}>
              Cargar Deal
            </div>
          </div>
          <div style={{fontSize:12,color:C.muted,marginTop:8}}>
            <b>¿Cómo funciona?</b> El vendedor cierra el deal y comparte solo un código. Pégalo aquí y apreta "Cargar Deal": se abre la calculadora con todo el desglose (Utilidad Proxy, bono y descuento) ya validado contra el catálogo vigente, y queda en tu registro.
          </div>
        </div>
      )}

      {/* ═══ CALCULATOR VIEW ═══ */}
      {view === "calc" && (<>

        {/* Brand */}
        {!marca && (
          <div style={base.section}>
            <div style={base.secTitle}>Selecciona marca</div>
            <div style={{display:"flex",gap:10}}>
              {["Peugeot","Citroën"].map(m=>(
                <div key={m} onClick={()=>{setMarca(m);setTipo(null);setMIdx(null);}}
                  style={{flex:1,padding:"20px 12px",borderRadius:10,border:"2px solid "+(m==="Peugeot"?C.peugeot:C.citroen),background:C.card,textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:16,color:m==="Peugeot"?C.peugeot:C.citroen}}>
                  {m}
                </div>
              ))}
            </div>
          </div>
        )}
        {marca && !tipo && (
          <div style={base.section}>
            <div style={base.secTitle}>Tipo de vehículo</div>
            <div style={{display:"flex",gap:10}}>
              {["Pasajeros","Comerciales"].map(t=>(
                <div key={t} onClick={()=>{setTipo(t);setMIdx(null);}}
                  style={{flex:1,padding:"16px",borderRadius:10,border:"2px solid "+mc,background:C.card,textAlign:"center",cursor:"pointer",fontWeight:600,fontSize:15,color:mc}}>
                  {t}
                </div>
              ))}
            </div>
            <div onClick={()=>setMarca(null)} style={{marginTop:10,fontSize:13,color:C.accent,cursor:"pointer"}}>← Cambiar marca</div>
          </div>
        )}
        {marca && tipo && mIdx === null && (
          <div style={base.section}>
            <div style={base.secTitle}>Selecciona modelo</div>
            {Object.entries(familias).map(([fam,items])=>(
              <div key={fam} style={{marginBottom:12}}>
                <div style={{fontSize:11,fontWeight:700,color:mc,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.04em"}}>{fam}</div>
                {items.map(m=>(
                  <div key={m.idx} onClick={()=>{setMIdx(m.idx);setPago("tmp");setDescPesos("");setBonoZonal("");setComisionCredito("");setAccItems(ACC_FIJOS.map(a=>({...a})));setShowUtil(false);setConfirmCierre(false);setPushVin("");setPushDispoOk(false);}}
                    style={{padding:"10px 14px",borderRadius:8,border:"1px solid "+C.border,background:C.card,marginBottom:5,cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                      <div style={{fontSize:13,fontWeight:600}}>{m.modelo.replace(m.familia+" ","")}</div>
                    </div>
                    <div style={{fontSize:12,color:C.muted}}>Lista {fmt(m.pl)}</div>
                  </div>
                ))}
              </div>
            ))}
            <div onClick={()=>setTipo(null)} style={{fontSize:13,color:C.accent,cursor:"pointer"}}>← Cambiar tipo</div>
          </div>
        )}

        {/* ═══ DEAL CALCULATOR ═══ */}
        {auto && calc && (<>
          {editingDealId && (
            <div style={base.section}>
              <div style={{padding:"8px 12px",borderRadius:6,background:C.accentLight,color:C.accent,fontSize:12,fontWeight:700}}>
                ✏️ Revisando / editando un deal ya cerrado
              </div>
            </div>
          )}
          {/* Model Card */}
          <div style={base.section}>
            <div style={{...base.card,borderLeft:"3px solid "+mc}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>{auto.modelo}</div>
              <div style={base.row}><span style={base.label}>Precio Lista</span><span style={{fontSize:16,fontWeight:700}}>{fmt(auto.pl)}</span></div>
              <div style={base.row}><span style={base.label}>CIT</span><span style={{fontSize:10,fontFamily:"monospace",color:C.muted}}>{auto.cit}</span></div>
            </div>
            <div onClick={()=>setMIdx(null)} style={{fontSize:13,color:C.accent,cursor:"pointer"}}>← Cambiar modelo</div>
          </div>

          {/* ═══ PROX_MES: sube de precio en septiembre (informativo, no toca el cálculo) ═══ */}
          {proxMes && (
            <div style={base.section}>
              <div style={{...base.card, border:"2px solid #ea580c", background:"#fff7ed"}}>
                <div style={{fontSize:13,fontWeight:800,color:"#c2410c"}}>📈 Sube en septiembre</div>
                <div style={{fontSize:12,color:C.muted,marginTop:2,marginBottom:6}}>
                  Este modelo sube <b style={{color:"#c2410c"}}>{fmt(proxMes.delta)}</b> desde el 1 de septiembre (hoy {fmt(proxMes.ago)} → septiembre {fmt(proxMes.sept)}).
                </div>
                <div style={{fontSize:10,color:C.light}}>
                  Fuente: boletín Stellantis {PROX_MES.boletin}, vigente {PROX_MES.vigencia}. Puede volver a actualizarse a mitad de mes — no lo prometas como precio final de todo septiembre.
                </div>
              </div>
            </div>
          )}

          {/* ═══ TIPO DE VENTA: Retail (B2C) o Flota (B2B) ═══ */}
          {/* Son dos mundos distintos: retail trabaja con bonos y descuento Pompeyo sobre el
              precio con IVA; flota va por tramo de volumen sobre el precio neto. No se mezclan. */}
          <div style={base.section}>
            <div style={base.secTitle}>Tipo de venta</div>
            <div style={{display:"flex",gap:6}}>
              {[["retail","🏠 Venta Retail"],["flota","🚚 Venta Flota"]].map(([k,label])=>(
                <div key={k} onClick={()=>setModoVenta(k)}
                  style={{flex:1,padding:"10px 8px",borderRadius:8,border:"2px solid "+(modoVenta===k?mc:C.border),background:modoVenta===k?mc+"10":C.card,color:modoVenta===k?mc:C.muted,fontWeight:modoVenta===k?700:500,fontSize:12,textAlign:"center",cursor:"pointer"}}>
                  {label}
                </div>
              ))}
            </div>
            {calc.esFlota && !calc.b2b && (
              <div style={{marginTop:8,padding:"8px 12px",borderRadius:6,background:C.redBg,borderLeft:"3px solid "+C.red,fontSize:12}}>
                Este modelo no tiene descuentos de flota publicados. La lista B2B solo trae comerciales, Rifter y Berlingo Multispace.
              </div>
            )}
          </div>

          {/* Forma de Pago (retail) / Tramo de flota (B2B) */}
          <div style={base.section}>
            <div style={base.secTitle}>{calc.esFlota ? "Tramo de flota (por volumen)" : "Forma de Pago"}</div>
            {calc.esFlota ? (
              calc.b2b ? (
                <div style={{display:"flex",gap:6}}>
                  {[["t1","T1","1 a 5 un."],["t2","T2","6 a 99 un."],["gc","GC","+100 un."]].map(([k,lab,rango])=>{
                    const hay = !!calc.b2b[k];
                    return (
                      <div key={k} onClick={()=>{ if(hay) setTramoFlota(k); }}
                        style={{flex:1,padding:"10px 8px",borderRadius:8,border:"2px solid "+(tramoFlota===k?mc:C.border),background:tramoFlota===k?mc+"10":C.card,color:tramoFlota===k?mc:C.muted,fontWeight:tramoFlota===k?700:500,textAlign:"center",cursor:hay?"pointer":"not-allowed",opacity:hay?1:0.35}}>
                        <div style={{fontSize:14,fontWeight:800}}>{lab}</div>
                        <div style={{fontSize:10}}>{rango}</div>
                      </div>
                    );
                  })}
                </div>
              ) : null
            ) : (
            <div style={{display:"flex",gap:6}}>
              {formasPago.map(fp=>(
                <div key={fp} onClick={()=>setPago(fp)}
                  style={{flex:1,padding:"10px 8px",borderRadius:8,border:"2px solid "+(pe===fp?mc:C.border),background:pe===fp?mc+"10":C.card,color:pe===fp?mc:C.muted,fontWeight:pe===fp?700:500,fontSize:12,textAlign:"center",cursor:"pointer"}}>
                  {PL[fp]}
                </div>
              ))}
            </div>
            )}
          </div>

          {/* ═══ PUSH VIN (unidades específicas con bono zonal adicional, campaña 13-23 ago) ═══ */}
          {pushList && (
            <div style={base.section}>
              <div style={{...base.card, border:"2px solid "+(pushSel?"#7c3aed":C.border), background:pushSel?"#faf5ff":C.card}}>
                <div style={{fontSize:13,fontWeight:800,color:"#7c3aed"}}>🔔 Push VIN disponible <span style={{fontSize:11,fontWeight:600,color:C.muted}}>· vence {PUSH_VIN.vigencia.split("-").reverse().join("-")}</span></div>
                <div style={{fontSize:12,color:C.muted,marginTop:2,marginBottom:8}}>
                  Bono adicional por unidad específica. Al elegir el VIN se carga el Aporte Marca en Bono Zonal y se sugiere el Descuento Pompeyo a igualar.
                </div>
                <select value={pushVin} onChange={e=>seleccionarPushVin(e.target.value)} style={{...base.input, cursor:"pointer"}}>
                  <option value="">— Sin push / elegir VIN —</option>
                  {pushList.map(x=>(
                    <option key={x.v} value={x.v}>{x.v} · {x.u}{x.a?(" · "+x.a+"d"):""} · {fmt(x.m)}</option>
                  ))}
                </select>
                {pushSel && (
                  <div style={{marginTop:10}}>
                    <div style={{padding:"6px 10px",borderRadius:6,background:"#ede9fe",fontSize:12,marginBottom:8,display:"inline-block"}}>
                      <b style={{color:"#7c3aed"}}>Push activo</b> · Total {fmt(pushSel.m)}
                    </div>
                    <div style={{fontSize:12,color:C.muted,marginBottom:4}}>Aporte Marca (→ Bono Zonal, plata de afuera): <b style={{color:"#7c3aed"}}>{fmt(pushSel.mk)}</b></div>
                    <div style={{fontSize:12,color:C.muted,marginBottom:8}}>Aporte Ces (→ Descuento Pompeyo, sale de tu margen): <b style={{color:"#7c3aed"}}>{fmt(pushSel.ce)}</b></div>
                    {calc && calc.descNum < pushSel.ce && (
                      <div style={{padding:"8px 12px",borderRadius:6,background:C.yellowBg,borderLeft:"3px solid "+C.yellow,fontSize:12,marginBottom:8}}>
                        ⚠️ Descuento Pompeyo actual ({fmt(calc.descNum)}) es menor al mínimo a igualar ({fmt(pushSel.ce)}). Subilo para cubrir el push.
                      </div>
                    )}
                    <label style={{display:"flex",alignItems:"flex-start",gap:8,cursor:"pointer",padding:"8px 10px",borderRadius:6,background:pushDispoOk?"#ecfdf5":"#fef2f2",border:"1px solid "+(pushDispoOk?C.green:"#fca5a5")}}>
                      <input type="checkbox" checked={pushDispoOk} onChange={e=>setPushDispoOk(e.target.checked)} style={{marginTop:2}} />
                      <span style={{fontSize:12,color:C.text}}>Confirmé que este VIN sigue disponible en ROMA antes de cerrar.</span>
                    </label>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Desglose Bonos — solo retail: en flota no hay bono ni CE */}
          {!calc.esFlota && (
          <div style={base.section}>
            <div style={base.secTitle}>Desglose Bono {PL[pe]}{calc.esCom ? " (con IVA)" : ""}</div>
            <div style={base.card}>
              {chip("Aporte Red (CE 2,5%)", calc.aporteRedConIva, "#b45309")}
              {chip("Aporte Stellantis (Marca)", calc.aporteSteConIva, C.accent)}
              {pe !== "tmp" && calc.aporteFinConIva > 0 && chip("Aporte Financiera", calc.aporteFinConIva, "#7c3aed")}
              <div style={base.divider} />
              <div style={base.row}>
                <span style={{fontSize:13,fontWeight:700}}>Bono Total</span>
                <span style={{fontSize:15,fontWeight:800,color:C.green}}>{fmt(calc.fp.bono)}</span>
              </div>
            </div>
          </div>
          )}

          {/* Descuentos — solo retail: en flota el descuento lo fija el tramo, no el vendedor */}
          {!calc.esFlota && (
          <div style={base.section}>
            <div style={base.secTitle}>Descuentos</div>
            <div style={base.card}>
              <div style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:13,color:C.muted}}>Descuento Pompeyo ($)</span>
                  {calc.descNum > 0 && (
                    <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:6,
                      background:calc.totalDadoPct>0.04?C.yellowBg:C.greenBg,
                      color:calc.totalDadoPct>0.04?C.yellow:C.green}}>
                      {pct(calc.totalDadoPct)} dado
                    </span>
                  )}
                </div>
                <input type="number" inputMode="numeric" value={descPesos} onChange={e=>setDescPesos(e.target.value)}
                  placeholder="Monto en pesos" style={base.input} />
                {calc.descNum > 0 && (
                  <div style={{fontSize:11,color:C.muted,marginTop:4,display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                    <span>Pompeyo {pct(calc.descPompeyoPct)}</span>
                    <span style={{color:C.light}}>+</span>
                    <span style={{color:"#b45309"}}>CE {pct(calc.cePct)}</span>
                    <span style={{color:C.light}}>=</span>
                    <span style={{fontWeight:700}}>Total {pct(calc.totalDadoPct)}</span>
                  </div>
                )}
                {calc.alertaDesc === "amarilla" && (
                  <div style={{padding:"8px 12px",borderRadius:6,background:C.yellowBg,borderLeft:"3px solid "+C.yellow,fontSize:12,marginTop:6}}>
                    ⚠️ Total dado sobre 4% (Pompeyo + CE) — requiere autorización
                  </div>
                )}
                {calc.alertaDesc === "roja" && (
                  <div style={{padding:"8px 12px",borderRadius:6,background:C.redBg,borderLeft:"3px solid "+C.red,fontSize:12,marginTop:6}}>
                    🚫 Tope: margen Red {fmt(calc.maxDescPesos)} ({pct(auto.margen)})
                  </div>
                )}
                <div style={{fontSize:11,color:C.light,marginTop:4}}>
                  Margen Red: {fmt(calc.maxDescPesos)} · Post CE: {fmt(calc.margenDisponible)} · Post Roma: {fmt(calc.margenDisponible - GASTOS_ROMA)}
                </div>
              </div>
              <div style={base.divider} />
              <div style={{marginTop:10}}>
                <div style={{fontSize:13,color:C.muted,marginBottom:4}}>Bono Zonal ($)</div>
                <input type="number" inputMode="numeric" value={bonoZonal} onChange={e=>setBonoZonal(e.target.value)}
                  readOnly={!!pushSel}
                  placeholder="0" style={{...base.input, ...(pushSel?{background:"#f1f5f9",color:C.muted}:{})}} />
                {pushSel && <div style={{fontSize:11,color:"#7c3aed",marginTop:4}}>Cargado por Push VIN (Aporte Marca {fmt(pushSel.mk)}). Se ajusta desde el panel Push.</div>}
              </div>
            </div>
          </div>
          )}

          {/* ═══ PRECIO FLOTA (B2B) ═══ */}
          {/* La lista B2B publica todo NETO. Los vendedores estan acostumbrados a hablar con IVA,
              asi que se muestran las dos cifras y se avisa cual es cual. */}
          {calc.esFlota && calc.trFlota && (
            <div style={base.section}>
              <div style={base.secTitle}>Precio Flota</div>
              <div style={{padding:"8px 12px",borderRadius:6,background:C.yellowBg,borderLeft:"3px solid "+C.yellow,fontSize:12,marginBottom:8}}>
                ⚠️ En flota la lista entrega <b>todos los valores SIN IVA</b>. Abajo va el neto y su equivalente con IVA.
              </div>
              <div style={{...base.card,background:mc+"06"}}>
                <div style={base.row}><span style={base.label}>Precio lista sin IVA</span><span style={base.val}>{fmt(calc.b2b.plSinIva)}</span></div>
                <div style={base.row}>
                  <span style={{fontSize:12,color:C.accent}}>− Aporte Stellantis ({pct(calc.steFlota)})</span>
                  <span style={{fontSize:12,color:C.accent,fontWeight:600}}>−{fmt(calc.aporteSteFlota)}</span>
                </div>
                <div style={base.row}>
                  <span style={{fontSize:12,color:"#b45309"}}>− Aporte concesionario ({pct(calc.redFlota)})</span>
                  <span style={{fontSize:12,color:"#b45309",fontWeight:600}}>−{fmt(calc.aporteRedFlota)}</span>
                </div>
                <div style={base.row}>
                  <span style={{fontSize:12,color:C.red,fontWeight:700}}>= Descuento total ({pct(calc.trFlota.pct)})</span>
                  <span style={{fontSize:12,color:C.red,fontWeight:700}}>−{fmt(calc.descFlotaPesos)}</span>
                </div>
                <div style={base.divider} />
                <div style={base.row}>
                  <span style={{fontSize:15,fontWeight:700}}>Precio flota NETO</span>
                  <span style={{fontSize:18,fontWeight:800}}>{fmt(calc.precioFlotaNeto)}</span>
                </div>
                <div style={base.row}>
                  <span style={{fontSize:13,color:C.muted}}>Equivalente con IVA (19%)</span>
                  <span style={{fontSize:14,fontWeight:700,color:C.muted}}>{fmt(calc.precioFlotaConIva)}</span>
                </div>
              </div>
              <div style={{...base.card,marginTop:8}}>
                <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.06em",opacity:0.6,marginBottom:6}}>Interno · no mostrar al cliente</div>
                <div style={base.row}><span style={base.label}>Margen fijo de lista</span><span style={base.val}>{pct(calc.b2b.margenFijo)}</span></div>
                <div style={base.row}><span style={base.label}>− Aporte concesionario (ya está en el descuento)</span><span style={base.val}>{pct(calc.redFlota)}</span></div>
                <div style={base.divider} />
                <div style={base.row}>
                  <span style={{fontSize:14,fontWeight:700}}>Margen que queda</span>
                  <span style={{fontSize:15,fontWeight:800}}>{fmt(calc.margenFlotaPesos)} <span style={{fontSize:12,opacity:0.7}}>({pct(calc.margenFlotaPct)})</span></span>
                </div>
                <div style={{fontSize:11,color:C.muted,marginTop:6}}>
                  Calculado como concesionario <b>{CONCESIONARIO_B2B === "professional" ? "Professional" : "No Professional"}</b>. El precio al cliente es el mismo en ambos casos; lo que cambia es cuánto pone la casa.
                </div>
              </div>
            </div>
          )}

          {/* Precio Vehículo — solo retail; en flota manda la tarjeta Precio Flota de arriba */}
          {!calc.esFlota && (
          <div style={base.section}>
            <div style={base.secTitle}>Precio Vehículo</div>
            <div style={{...base.card,background:mc+"06"}}>
              <div style={base.row}><span style={base.label}>Precio Lista</span><span style={base.val}>{fmt(auto.pl)}</span></div>
              <div style={base.row}><span style={{fontSize:12,color:"#b45309"}}>− Aporte Red (CE)</span><span style={{fontSize:12,color:"#b45309",fontWeight:600}}>−{fmt(calc.aporteRedConIva)}</span></div>
              <div style={base.row}><span style={{fontSize:12,color:C.accent}}>− Aporte Stellantis</span><span style={{fontSize:12,color:C.accent,fontWeight:600}}>−{fmt(calc.aporteSteConIva)}</span></div>
              {pe !== "tmp" && calc.aporteFinConIva > 0 && (
                <div style={base.row}><span style={{fontSize:12,color:"#7c3aed"}}>− Aporte Financiera</span><span style={{fontSize:12,color:"#7c3aed",fontWeight:600}}>−{fmt(calc.aporteFinConIva)}</span></div>
              )}
              {calc.descNum > 0 && (
                <div style={base.row}><span style={{fontSize:12,color:C.red}}>− Desc. Pompeyo</span><span style={{fontSize:12,color:C.red,fontWeight:600}}>−{fmt(calc.descNum)}</span></div>
              )}
              {calc.bonoZonalNum > 0 && (
                <div style={base.row}><span style={{fontSize:12,color:C.green}}>− Bono Zonal</span><span style={{fontSize:12,color:C.green,fontWeight:600}}>−{fmt(calc.bonoZonalNum)}</span></div>
              )}
              <div style={base.divider} />
              <div style={base.row}>
                <span style={{fontSize:15,fontWeight:700}}>Precio Auto</span>
                <span style={{fontSize:18,fontWeight:800}}>{fmt(calc.precioAuto)}</span>
              </div>
              <div style={base.row}><span style={base.label}>Neto sin IVA</span><span style={{fontSize:12,color:C.muted}}>{fmt(calc.precioNeto)}</span></div>
            </div>
          </div>
          )}

          {/* Documentación */}
          <div style={base.section}>
            <div style={base.secTitle}>Documentación</div>
            <div style={base.card}>
              {docItems.map(d => (
                <div key={d.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",opacity:d.activo?1:0.4}}>
                  <div onClick={()=>toggleDoc(d.id)}
                    style={{width:22,height:22,borderRadius:6,border:"2px solid "+(d.activo?mc:C.border),background:d.activo?mc:"transparent",
                      display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,color:"#fff",fontSize:12,fontWeight:700}}>
                    {d.activo ? "✓" : ""}
                  </div>
                  <span style={{flex:1,fontSize:13,color:d.activo?C.text:C.muted}}>{d.nombre}</span>
                  <input type="number" inputMode="numeric" value={d.monto||""} onChange={e=>updateDocMonto(d.id,e.target.value)}
                    style={{width:100,padding:"6px 8px",borderRadius:6,border:"1px solid "+C.border,fontSize:13,textAlign:"right",fontFamily:"inherit",outline:"none",background:d.activo?C.card:"#f0f0f0"}}
                    disabled={!d.activo} />
                </div>
              ))}
              <div style={base.divider} />
              <div style={base.row}>
                <span style={{fontWeight:700,fontSize:13}}>Total Documentación</span>
                <span style={{fontWeight:700,fontSize:14}}>{fmt(calc.totalDoc)}</span>
              </div>
            </div>
          </div>

          {/* Accesorios */}
          <div style={base.section}>
            <div style={base.secTitle}>Accesorios</div>
            <div style={base.card}>
              {accItems.map(a => (
                <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0"}}>
                  {/* Los accesorios obligatorios (Grabado) llevan candado en vez de la × */}
                  {a.fijo ? (
                    <div title="Accesorio obligatorio"
                      style={{width:22,height:22,borderRadius:6,background:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0}}>
                      🔒
                    </div>
                  ) : (
                    <div onClick={()=>removeAcc(a.id)}
                      style={{width:22,height:22,borderRadius:6,background:C.redBg,color:C.red,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:14,fontWeight:700,flexShrink:0}}>
                      ×
                    </div>
                  )}
                  <span style={{flex:1,fontSize:13}}>{a.nombre}{a.fijo && <span style={{fontSize:10,color:C.muted,marginLeft:5}}>obligatorio</span>}</span>
                  <input type="number" inputMode="numeric" value={a.monto||""} onChange={e=>updateAccMonto(a.id,e.target.value)}
                    style={{width:100,padding:"6px 8px",borderRadius:6,border:"1px solid "+C.border,fontSize:13,textAlign:"right",fontFamily:"inherit",outline:"none"}} />
                </div>
              ))}
              {accItems.length > 0 && <div style={base.divider} />}
              <div style={{display:"flex",gap:6,alignItems:"center",marginTop:accItems.length?6:0}}>
                <input type="text" value={newAccNombre} onChange={e=>setNewAccNombre(e.target.value)}
                  placeholder="Nombre" style={{...base.input,flex:1,padding:"8px 10px",fontSize:13}} />
                <input type="number" inputMode="numeric" value={newAccMonto} onChange={e=>setNewAccMonto(e.target.value)}
                  placeholder="$" style={{width:90,padding:"8px 10px",borderRadius:8,border:"1px solid "+C.border,fontSize:13,textAlign:"right",fontFamily:"inherit",outline:"none"}} />
                <div onClick={addAcc}
                  style={{width:36,height:36,borderRadius:8,background:mc,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:18,fontWeight:700,flexShrink:0}}>
                  +
                </div>
              </div>
              {calc.totalAcc > 0 && (<>
                <div style={{...base.divider,marginTop:8}} />
                <div style={base.row}>
                  <span style={{fontWeight:700,fontSize:13}}>Total Accesorios</span>
                  <span style={{fontWeight:700,fontSize:14}}>{fmt(calc.totalAcc)}</span>
                </div>
              </>)}
            </div>
          </div>

          {/* Total Cliente */}
          <div style={base.section}>
            <div style={{...base.card,background:C.primary,color:"#fff",border:"none"}}>
              <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.06em",opacity:0.6,marginBottom:6}}>
                Valor Total Cliente{calc.esFlota ? " · Flota (con IVA)" : ""}
              </div>
              <div style={{fontSize:26,fontWeight:800,marginBottom:4}}>{fmt(calc.totalClienteFinal)}</div>
              <div style={{fontSize:11,opacity:0.5}}>
                Auto {fmt(calc.precioAutoFinal)} + Doc {fmt(calc.totalDoc)}{calc.totalAcc>0?" + Acc "+fmt(calc.totalAcc):""}
              </div>
              {calc.esFlota && calc.trFlota && (
                <div style={{fontSize:11,opacity:0.5,marginTop:4}}>
                  Vehículo neto sin IVA: {fmt(calc.precioFlotaNeto)}
                </div>
              )}
            </div>
          </div>

          {/* Utilidad Proxy */}
          <div style={base.section}>
            <div onClick={()=>setShowUtil(!showUtil)}
              style={{...base.card,cursor:"pointer",border:"2px solid "+(showUtil?calc.utilColor:C.border)}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.05em",color:C.muted}}>Utilidad Proxy (interno)</div>
                  <div style={{fontSize:11,color:C.red,fontWeight:600}}>⛔ No mostrar al cliente</div>
                </div>
                <div style={{fontSize:18}}>{showUtil?"▾":"▸"}</div>
              </div>
            </div>
            {showUtil && (
              <div style={{...base.card,borderLeft:"3px solid "+calc.utilColor}}>
                <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",marginBottom:6}}>Margen del negocio{calc.esFlota?" · flota (todo neto)":""}</div>
                {/* Flota y retail no comparten el desglose: en flota no hay margen Red ni CE
                    ni descuento Pompeyo, y las cifras van netas. Los gastos de Roma si son
                    los mismos en los dos casos. */}
                {calc.esFlota ? (<>
                  {chip("Margen fijo de lista ("+pct(calc.b2b ? calc.b2b.margenFijo : 0)+")", calc.b2b ? Math.round(calc.b2b.plSinIva * calc.b2b.margenFijo) : 0)}
                  {chip("− Aporte concesionario ("+pct(calc.redFlota)+")", calc.b2b ? Math.round(calc.b2b.plSinIva * calc.redFlota) : 0, "#b45309")}
                  <div style={base.divider} />
                  {chip("= Margen que queda", calc.margenFlotaPesos)}
                  {chip("− Gastos prorrateados Roma", GASTOS_ROMA, C.muted)}
                  <div style={base.divider} />
                  <div style={base.row}>
                    <span style={{fontSize:13,fontWeight:700}}>Margen neto flota</span>
                    <span style={{fontSize:14,fontWeight:700,color:calc.margenFlotaNeto<0?C.red:C.text}}>{fmt(calc.margenFlotaNeto)}</span>
                  </div>
                </>) : (<>
                  {chip("Margen Red bruto ("+pct(auto.margen)+")", calc.margenBruto)}
                  {chip("− Aporte Red CE (2,5%)"+(calc.esCom?" (con IVA)":""), calc.aporteRedConIva, "#b45309")}
                  <div style={base.divider} />
                  {chip("= Margen post CE", calc.margenDisponible)}
                  {calc.descNum > 0 && chip("− Desc. Pompeyo", calc.descNum, C.red)}
                  {chip("= Margen post descuento", calc.margenNetoAuto)}
                  {chip("− Gastos prorrateados Roma", GASTOS_ROMA, C.muted)}
                  <div style={base.divider} />
                  <div style={base.row}>
                    <span style={{fontSize:13,fontWeight:700}}>Margen neto auto</span>
                    <span style={{fontSize:14,fontWeight:700,color:calc.margenNeto<0?C.red:C.text}}>{fmt(calc.margenNeto)}</span>
                  </div>
                </>)}
                <div style={{marginTop:10,marginBottom:8}}>
                  <div style={{fontSize:13,color:C.muted,marginBottom:4}}>Comisión crédito ($)</div>
                  <input type="number" inputMode="numeric" value={comisionCredito} onChange={e=>setComisionCredito(e.target.value)}
                    placeholder="0" style={base.input} />
                </div>
                <div style={base.divider} />
                <div style={base.row}>
                  <span style={{fontWeight:700}}>Utilidad Proxy</span>
                  <span style={{fontWeight:800,fontSize:17,color:calc.utilColor}}>{calc.utilIcon} {fmt(calc.utilFinal)}</span>
                </div>
                <div style={base.row}>
                  <span style={base.label}>% sobre precio lista{calc.esFlota?" sin IVA":""}</span>
                  <span style={{display:"inline-block",padding:"2px 8px",borderRadius:6,fontSize:12,fontWeight:700,
                    background:calc.utilPctFinal>=0.05?C.greenBg:calc.utilPctFinal>=0.03?C.yellowBg:C.redBg,
                    color:calc.utilColor}}>{pct(calc.utilPctFinal)}</span>
                </div>
                {/* APC */}
                {/* En flota no hay bonos ni CE: el reparto es quien pone cada parte del
                    descuento. Mostrar aca las cifras de retail seria mezclar los dos mundos. */}
                {calc.esFlota ? (
                  <div style={{marginTop:14,padding:"12px",background:C.bg,borderRadius:8}}>
                    <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:C.muted,marginBottom:8}}>Quién pone el descuento (flota, neto)</div>
                    <div style={{paddingLeft:8}}>
                      {chip("Aporte Stellantis ("+pct(calc.steFlota)+")", calc.aporteSteFlota, C.accent)}
                      {chip("Aporte concesionario ("+pct(calc.redFlota)+")", calc.aporteRedFlota, "#b45309")}
                      <div style={{...base.divider,margin:"4px 0"}} />
                      {chip("Descuento total ("+pct(calc.trFlota ? calc.trFlota.pct : 0)+")", calc.descFlotaPesos)}
                    </div>
                  </div>
                ) : (
                <div style={{marginTop:14,padding:"12px",background:C.bg,borderRadius:8}}>
                  <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:C.muted,marginBottom:8}}>Distribución APC / Roma{calc.esCom ? " (bonos con IVA)" : ""}</div>
                  <div style={{fontSize:11,fontWeight:700,color:mc,marginBottom:4}}>BONOS</div>
                  <div style={{paddingLeft:8,marginBottom:8}}>
                    {chip("Aporte Stellantis (Marca)", calc.aporteSteConIva, C.accent)}
                    {pe !== "tmp" && calc.aporteFinConIva > 0 && chip("Aporte Financiera (cobro aparte)", calc.aporteFinConIva, "#7c3aed")}
                    {calc.bonoZonalNum > 0 && chip("Bono Zonal", calc.bonoZonalNum, C.green)}
                    <div style={{...base.divider,margin:"4px 0"}} />
                    {chip("Total Bonos", calc.aporteSteConIva + (pe!=="tmp"?(calc.aporteFinConIva||0):0) + calc.bonoZonalNum)}
                  </div>
                  <div style={{fontSize:11,fontWeight:700,color:C.red,marginBottom:4}}>DESCUENTO (del margen dealer)</div>
                  <div style={{paddingLeft:8}}>
                    {chip("Aporte Red CE (2,5%)", calc.aporteRedConIva, "#b45309")}
                    {calc.descNum > 0 && chip("Desc. Pompeyo", calc.descNum, C.red)}
                    <div style={{...base.divider,margin:"4px 0"}} />
                    {chip("Total Descuento", calc.aporteRedConIva + calc.descNum)}
                  </div>
                </div>
                )}
              </div>
            )}
          </div>

          {/* ═══ CERRAR DEAL ═══ */}
          <div style={base.section}>
            {!calc.esFlota && (pe === "cc" || pe === "ci") && !comisionCredito && (
              <div style={{padding:"8px 12px",borderRadius:6,background:C.yellowBg,borderLeft:"3px solid "+C.yellow,fontSize:12,marginBottom:8}}>
                ⚠️ Falta la Comisión Crédito (sección Utilidad Proxy). En crédito es obligatoria para cerrar: sin ella la utilidad que se comparte queda mal.
              </div>
            )}
            {!confirmCierre ? (
              (pushSel && !pushDispoOk) ? (
                <div style={{padding:"14px",borderRadius:10,background:"#e5e7eb",color:C.muted,textAlign:"center",fontWeight:700,fontSize:14}}>
                  🔒 Confirmá la disponibilidad del VIN en el panel Push para poder cerrar
                </div>
              ) : (
              <div onClick={()=>setConfirmCierre(true)}
                style={{padding:"14px",borderRadius:10,background:C.green,color:"#fff",textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:15}}>
                {editingDealId ? "✅ Actualizar Deal" : "✅ Cerrar Deal"}
              </div>
              )
            ) : (
              <div style={{...base.card,border:"2px solid "+C.green}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>{editingDealId ? "Confirmar actualización del deal" : "Confirmar cierre del deal"}</div>
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:13,color:C.muted,marginBottom:4}}>Nombre del cliente</div>
                  <input type="text" value={cliente} onChange={e=>setCliente(e.target.value)}
                    placeholder="Nombre del cliente" style={base.input} />
                </div>
                {/* El RUT es la llave para reencontrar el deal despues, por eso se valida el DV. */}
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:13,color:C.muted,marginBottom:4}}>RUT del cliente</div>
                  <input type="text" value={rutCliente} onChange={e=>setRutCliente(formatearRut(e.target.value))}
                    placeholder="12.345.678-9" style={{...base.input, border:"1px solid "+(rutCliente && !rutValido(rutCliente) ? C.red : C.border)}} />
                  {rutCliente && !rutValido(rutCliente) && (
                    <div style={{fontSize:11,color:C.red,marginTop:4}}>RUT inválido — revisá el dígito verificador.</div>
                  )}
                </div>
                {/* La comisión también se puede cargar acá: es el mismo dato que en Utilidad Proxy,
                    para no obligar a cancelar el cierre e ir a buscarlo a otra sección. */}
                {!calc.esFlota && (pe === "cc" || pe === "ci") && (
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:13,color:C.muted,marginBottom:4}}>Comisión Crédito (obligatoria en {PL[pe]})</div>
                    <input type="number" inputMode="numeric" value={comisionCredito} onChange={e=>setComisionCredito(e.target.value)}
                      placeholder="0" style={{...base.input, border:"1px solid "+(comisionCredito ? C.border : C.yellow)}} />
                    {!comisionCredito && (
                      <div style={{fontSize:11,color:C.yellow,marginTop:4}}>Sin este dato la utilidad que se comparte queda mal, por eso no deja cerrar.</div>
                    )}
                  </div>
                )}
                <div style={{fontSize:12,color:C.muted,marginBottom:10}}>
                  Se guardará en el registro local, se enviará a Sheets{SCRIPT_URL?" ✅":" (pendiente)"}, y en la pantalla de inicio vas a poder Compartir o Copiar el resumen.
                </div>
                <div style={{display:"flex",gap:8}}>
                  <div onClick={()=>setConfirmCierre(false)}
                    style={{flex:1,padding:"12px",borderRadius:8,border:"1px solid "+C.border,textAlign:"center",cursor:"pointer",fontSize:13,color:C.muted}}>
                    Cancelar
                  </div>
                  <div onClick={cerrarDeal}
                    style={{flex:1,padding:"12px",borderRadius:8,background:C.green,color:"#fff",textAlign:"center",cursor:"pointer",fontWeight:700,fontSize:13,opacity:puedeCerrar?1:0.4,pointerEvents:puedeCerrar?"auto":"none"}}>
                    {editingDealId ? "Confirmar y Compartir" : "Confirmar y Compartir"}
                  </div>
                </div>
              </div>
            )}
          </div>
        </>)}
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DealFinal />);
</script>
</body>
</html>
